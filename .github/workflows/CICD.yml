name: CICD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: build-test-deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install
        working-directory: ./frontend-astro

      - name: Run prod build
        run: npm run build
        working-directory: ./frontend-astro

      - name: Create artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./frontend-astro/dist

      - name: Publish master to Netlify only on a 'push' to master
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npm run netlify:deploy:prod -- --message "Deployed from GithubActions commit(github_sha)-${GITHUB_SHA}"
        working-directory: ./frontend-astro

      - name: Deploy preview to Netlify (non-master branches)
        if: github.event_name == 'pull_request'
        id: netlify_preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          DEPLOY_JSON=$(npm run --silent netlify:deploy:preview -- --json --message "Preview: ${GITHUB_REF_NAME} @ ${GITHUB_SHA}")
          DEPLOY_URL=$(echo "$DEPLOY_JSON" | jq -r '.deploy_url')
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        working-directory: ./frontend-astro

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && github.ref != 'refs/heads/master'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.netlify_preview.outputs.deploy_url }}';
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Netlify Preview Deployed**\n\nBranch: \`${branch}\`  Commit: \`${sha}\`\n\n[View Preview](${deployUrl})`
            });
